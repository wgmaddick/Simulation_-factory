[theme]
base = "dark"
primaryColor = "#2f81f7"
backgroundColor = "#0b0f17"
secondaryBackgroundColor = "#131d2a"
textColor = "#f8fafc"
font = "sans serif"

[server]
headless = true
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 5
maxMessageSize = 50

[browser]
gatherUsageStats = false

[client]
# Host multipage sidebar nav stays off for private iPad chrome.
# App surfaces (Executive Command / Kinetic Lab / AI Assistant) are linked
# explicitly via surface_nav.py so pages remain reachable.
toolbarMode = "viewer"
showSidebarNavigation = false
