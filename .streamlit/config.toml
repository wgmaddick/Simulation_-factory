[theme]
base = "dark"
primaryColor = "#2f81f7"
backgroundColor = "#0b0f17"
secondaryBackgroundColor = "#131d2a"
textColor = "#f8fafc"
font = "sans serif"

[server]
headless = true
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 5
maxMessageSize = 50

[browser]
gatherUsageStats = false

[client]
# Minimal host chrome; Private Chrome CSS also hides Cloud GitHub watermark.
toolbarMode = "minimal"
showSidebarNavigation = false
